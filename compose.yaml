# The whole system with one command: docker compose up  ->  web UI on http://localhost:8080
# Needs GOOGLE_API_KEY (a Gemini API key): GOOGLE_API_KEY=<key> docker compose up, or in .env (see .env.example).
name: triage

services:
  triage:
    build:
      context: .
      dockerfile: apps/triage/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:?GOOGLE_API_KEY is not set: run GOOGLE_API_KEY=<your Gemini API key> docker compose up, or put the key in .env (see .env.example)}"
      DATABASE_PATH: /var/lib/triage/runs.sqlite
    ports:
      - "${TRIAGE_PORT:-3000}:3000"
    volumes:
      - runs:/var/lib/triage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      triage:
        condition: service_healthy

volumes:
  runs:
