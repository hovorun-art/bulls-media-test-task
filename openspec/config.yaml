schema: spec-flow

# Project facts for every artifact. The flow's own rules (brief, approval, test first, task groups)
# live in openspec/schemas/spec-flow/schema.yaml and CLAUDE.md; keep only what is specific to this product.
# This text is added to every `openspec instructions` answer, so keep it short: the stack, the layout
# and the code rules are already in CLAUDE.md and .claude/rules/.
context: |
  An AI agent that triages e-commerce support tickets: classify, research with tools (knowledge base,
  orders, refund rules), decide (reply, propose_refund, escalate, refuse) and draft a reply for a human.
  Guarantees: money rules (refund eligibility, limits) are code, never the model; prompt injection never
  changes the policy; model failures end in an escalation, never an error; every run is stored with its trace.

