server {
  listen 80;
  root /usr/share/nginx/html;

  # A run's event stream: each step goes out as it happens, kept open by the service's heartbeats.
  location ~ ^/api/runs/[^/]+/events$ {
    proxy_pass http://triage:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://triage:3000;
  }

  location / {
    try_files $uri /index.html;
  }
}
